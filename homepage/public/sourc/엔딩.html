<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>콜마당 엔딩 카드</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --main-yellow: #FFD400; /* 콜링크 메인 컬러 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* 깔끔한 블랙 배경 */
            color: #ffffff;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 1000px;
        }

        /* 요청하신 대로 더 볼드하게 강조된 상단 문구 */
        .top-danger {
            font-size: 2.2rem;
            font-weight: 800; 
            color: #ffffff;
            margin-bottom: 40px;
            letter-spacing: -1px;
        }

        .main-slogan {
            font-size: 5.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -3px;
            line-height: 1.1;
        }

        .highlight-yellow {
            color: var(--main-yellow);
        }

        .sub-vision {
            font-size: 2.5rem;
            font-weight: 700;
            color: #eeeeee;
            margin-top: 10px;
            margin-bottom: 80px;
        }

        .footer {
            font-size: 1.5rem;
            color: #666;
            border-top: 1px solid #222;
            padding-top: 40px;
        }

        .url {
            color: var(--main-yellow);
            font-weight: 800;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-danger">운전 중 배차, 도로 위 수많은 위험들</div>
    
    <div class="main-slogan">
        <span class="highlight-yellow">원클릭</span>이면 배차 끝
    </div>
    
    <div class="sub-vision">
        콜마당이 만드는 달리는 사무실
    </div>

    <div class="footer">
        <span class="url">calllink.io.kr</span>
    </div>
</div>

</body>
</html>
