<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배차 비교 데모</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--primary:#FFAB00;--navy:#0f1a2e;--white:#fff;--yellow:#FFD400}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--navy);color:var(--white);
      min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

    .wrap{width:100%;max-width:500px;padding:12px}

    .hdr{text-align:center;margin-bottom:16px;padding:0;min-height:28px;display:flex;align-items:center;justify-content:center;position:relative}
    .hdr-title{font-size:1.1rem;font-weight:900;color:var(--white);transition:opacity .3s;white-space:pre-line}
    /* Scene 3 폰별 라벨 (hdr 내부, absolute) */
    .phone-lbl{
      position:absolute;top:50%;transform:translate(-50%,-50%);
      font-size:1.1rem;font-weight:900;color:var(--white);
      white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none;
    }
    .phone-lbl.vis{opacity:1}

    /* 폰 아래 아이콘 (개별 배치) */
    .phone-ic{
      position:absolute;z-index:15;pointer-events:none;
      display:flex;flex-direction:column;align-items:center;gap:4px;
      opacity:0;transition:opacity .4s,left .5s ease;
    }
    .phone-ic.vis{opacity:1}
    .phone-ic .pic{width:44px;height:44px;border-radius:12px;overflow:hidden;
      border:2px solid transparent;transition:border-color .3s,box-shadow .3s}
    .phone-ic.on .pic{border-color:var(--primary);box-shadow:0 0 10px rgba(255,171,0,.3)}
    .phone-ic .pic img{width:100%;height:100%;object-fit:cover;display:block}
    .phone-ic .pic svg{width:100%;height:100%;display:block}
    .phone-ic .pname{font-size:.5rem;color:rgba(255,255,255,.35);font-weight:500;white-space:nowrap;transition:color .3s}
    .phone-ic.on .pname{color:var(--primary)}

    /* 스테이지 — 9:20 비율 맞춤 */
    .stage{position:relative;width:100%;height:378px;overflow:visible}

    .phone{
      position:absolute;width:170px;height:378px;border-radius:22px;overflow:hidden;
      background:#000;border:3px solid rgba(255,255,255,.1);
      box-shadow:0 10px 40px rgba(0,0,0,.5);
      top:0;opacity:0;
      transition:opacity .5s ease, left .5s ease, box-shadow .3s, border-color .3s;
      z-index:2;
    }
    .phone img{width:100%;height:100%;object-fit:cover;display:block}
    .phone .scr{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity .25s}
    .phone .scr.vis{opacity:1}
    .phone.glow{box-shadow:0 0 30px rgba(255,171,0,.5),0 10px 40px rgba(0,0,0,.5);border-color:var(--primary)}

    /* 커서 */
    .cur{position:absolute;width:48px;height:48px;z-index:20;opacity:0;pointer-events:none;
      transition:left .6s cubic-bezier(.4,0,.2,1),top .6s cubic-bezier(.4,0,.2,1),opacity .25s;
      filter:drop-shadow(1px 2px 2px rgba(0,0,0,.6))}
    .cur.vis{opacity:1}
    .cur.click{animation:ck .2s ease}
    @keyframes ck{0%{transform:scale(1)}50%{transform:scale(.75)}100%{transform:scale(1)}}

    .rip{position:absolute;width:30px;height:30px;border-radius:50%;border:2px solid var(--primary);
      opacity:0;z-index:19;pointer-events:none;transform:translate(-50%,-50%) scale(0)}
    .rip.go{animation:rp .35s ease-out forwards}
    @keyframes rp{0%{opacity:1;transform:translate(-50%,-50%) scale(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}

    /* 엔딩 카드 */
    .ending{position:absolute;top:0;left:0;right:0;bottom:0;
      display:flex;align-items:center;justify-content:center;
      text-align:center;z-index:15;pointer-events:none;
      opacity:0;transition:opacity .6s}
    .ending.vis{opacity:1}
    .ending-inner{width:100%}
    .ending-top{font-size:.85rem;font-weight:800;color:rgba(255,255,255,.7);margin-bottom:16px;letter-spacing:-0.5px}
    .ending-main{font-size:2rem;font-weight:900;margin-bottom:8px;letter-spacing:-1.5px;line-height:1.2;color:#fff}
    .ending-main .hl{color:var(--yellow)}
    .ending-sub{font-size:1rem;font-weight:700;color:#eee;margin-bottom:32px}
    .ending-url{font-size:.8rem;color:#666;border-top:1px solid #222;padding-top:16px;display:inline-block}
    .ending-url span{color:var(--yellow);font-weight:800}

    /* 컨트롤 */
    .ctrls{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:8px}
    .cbtn{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);
      width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;
      justify-content:center;font-size:.6rem;transition:border-color .2s,color .2s}
    .cbtn:hover,.cbtn.active{border-color:var(--primary);color:var(--primary)}

    @media(min-width:640px){
      .phone{width:200px;height:444px}
      .stage{height:444px}
      .phone-ic .pic{width:50px;height:50px}
      .ending-main{font-size:2.5rem}
      .ending-top{font-size:1rem}
      .ending-sub{font-size:1.2rem}
      .phone-lbl{font-size:1.3rem}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="hdr" id="hdr">
    <div class="hdr-title" id="title">고객이 전화한다</div>
    <div class="phone-lbl" id="lblMgr">원클릭 배차끝</div>
    <div class="phone-lbl" id="lblOld">1/7</div>
  </div>

  <div class="stage" id="stage">
    <svg class="cur" id="cur" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 2L10 20L13 13L20 16L2 2Z" fill="#fff" stroke="#222" stroke-width="1.2" stroke-linejoin="round"/>
    </svg>
    <div class="rip" id="rip"></div>

    <!-- 엔딩 카드 -->
    <div class="ending" id="ending">
      <div class="ending-inner">
        <div class="ending-top">운전 중 배차, 도로 위 수많은 위험들</div>
        <div class="ending-main"><span class="hl">원클릭</span>이면 배차 끝</div>
        <div class="ending-sub">콜마당이 만드는 달리는 사무실</div>
        <div class="ending-url"><span>calllink.io.kr</span></div>
      </div>
    </div>

    <!-- 폰 아래 아이콘 -->
    <div class="phone-ic" id="icMgr">
      <div class="pic"><img src="sourc/%EC%86%90%EB%8B%98%EC%95%B1.png" alt="콜마당"></div>
      <div class="pname">콜마당</div>
    </div>
    <div class="phone-ic" id="icOld">
      <div class="pic">
        <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
          <rect width="44" height="44" rx="12" fill="#2e7d32"/>
          <path d="M10 16c0-1.7 1.3-3 3-3h2c1.2 0 2.2.7 2.6 1.8l1 2.5c.3.8.1 1.8-.5 2.4l-1 1c1.2 2.4 3.2 4.4 5.6 5.6l1-1c.6-.6 1.6-.8 2.4-.5l2.5 1c1.1.4 1.8 1.4 1.8 2.6v2c0 1.7-1.3 3-3 3C17.8 30.4 10 22.6 10 16z" fill="#fff"/>
        </svg>
      </div>
      <div class="pname">일반전화</div>
    </div>

    <!-- 고객 폰 (Scene 1-2) -->
    <div class="phone" id="pCust">
      <div class="scr vis" data-s="call"><img src="sourc/%EC%9D%BC%EB%B0%98%EC%BD%9C.jpg"></div>
    </div>

    <!-- 콜매니저 폰 -->
    <div class="phone" id="pMgr">
      <div class="scr vis" data-s="ring"><img src="sourc/%EC%BD%9C%EB%A7%A4%EB%8B%88%EC%A0%801.jpg"></div>
      <div class="scr" data-s="call"><img src="sourc/%EC%BD%9C%EB%A7%A4%EB%8B%88%EC%A0%802.jpg"></div>
      <div class="scr" data-s="dispatch"><img src="sourc/%EC%BD%9C%EB%A7%A4%EB%8B%88%EC%A0%803.jpg"></div>
    </div>

    <!-- 일반 방식 폰 (Scene 3) -->
    <div class="phone" id="pOld">
      <div class="scr vis" data-s="s1"><img src="sourc/%EC%9D%BC%EB%B0%98%ED%81%B4%EB%A6%AD/%EC%9D%BC%EB%B0%981.jpg"></div>
      <div class="scr" data-s="s2"><img src="sourc/%EC%9D%BC%EB%B0%98%ED%81%B4%EB%A6%AD/%EC%9D%BC%EB%B0%982.jpg"></div>
      <div class="scr" data-s="s3"><img src="sourc/%EC%9D%BC%EB%B0%98%ED%81%B4%EB%A6%AD/%EC%9D%BC%EB%B0%983.jpg"></div>
      <div class="scr" data-s="s4"><img src="sourc/%EC%9D%BC%EB%B0%98%ED%81%B4%EB%A6%AD/%EC%9D%BC%EB%B0%984.jpg"></div>
      <div class="scr" data-s="s5"><img src="sourc/%EC%9D%BC%EB%B0%98%ED%81%B4%EB%A6%AD/%EC%9D%BC%EB%B0%985.jpg"></div>
      <div class="scr" data-s="s6"><img src="sourc/%EC%9D%BC%EB%B0%98%ED%81%B4%EB%A6%AD/%EC%9D%BC%EB%B0%986.jpg"></div>
      <div class="scr" data-s="s7"><img src="sourc/%EC%9D%BC%EB%B0%98%ED%81%B4%EB%A6%AD/%EC%9D%BC%EB%B0%987.jpg"></div>
    </div>
  </div>

  <!-- 아이콘 자리 확보 (레이아웃 안정) -->
  <div style="height:68px"></div>

  <div class="ctrls">
    <button class="cbtn" id="btnPlay">&#10074;&#10074;</button>
  </div>
</div>

<audio id="bgm" preload="auto" src="sourc/Seamless_Flow.mp3"></audio>

<script>
(function(){
  var stage=document.getElementById('stage');
  var cur=document.getElementById('cur');
  var rip=document.getElementById('rip');
  var hdr=document.getElementById('hdr');
  var titleEl=document.getElementById('title');
  var lblMgr=document.getElementById('lblMgr');
  var lblOld=document.getElementById('lblOld');
  var pCust=document.getElementById('pCust');
  var pMgr=document.getElementById('pMgr');
  var pOld=document.getElementById('pOld');
  var icMgr=document.getElementById('icMgr');
  var icOld=document.getElementById('icOld');
  var bgm=document.getElementById('bgm');
  var btnPlay=document.getElementById('btnPlay');
  var endingEl=document.getElementById('ending');

  var playing=true, pool=[], fadeInt=null;
  var VOL=0.3;

  function w(fn,ms){var t=setTimeout(function(){if(playing){fn();return}var ck=setInterval(function(){if(playing){clearInterval(ck);fn()}},50);pool.push(ck)},ms);pool.push(t)}
  function stopAll(){pool.forEach(clearTimeout);pool=[];if(fadeInt){clearInterval(fadeInt);fadeInt=null}}

  function bgmStart(){bgm.currentTime=0;bgm.volume=VOL;bgm.play().catch(function(){})}
  function bgmStop(){bgm.pause();bgm.currentTime=0}
  function bgmFadeOut(ms,cb){
    var steps=20,step=0,iv=ms/steps,startVol=bgm.volume;
    fadeInt=setInterval(function(){
      step++;bgm.volume=Math.max(0,startVol*(1-step/steps));
      if(step>=steps){clearInterval(fadeInt);fadeInt=null;bgm.pause();if(cb)cb()}
    },iv);
  }

  function setT(t){
    titleEl.style.opacity='0';
    lblMgr.classList.remove('vis');lblOld.classList.remove('vis');
    if(t){w(function(){titleEl.textContent=t;titleEl.style.opacity='1'},180)}
  }
  // hdr는 wrap 기준, stage도 wrap 기준이므로 stage.offsetLeft로 폰 중앙 계산
  function showLabels(mgrPx,oldPx){
    titleEl.style.opacity='0';
    var hdrRect=hdr.getBoundingClientRect(),wrapRect=hdr.parentElement.getBoundingClientRect();
    lblMgr.style.left=(mgrPx+phoneW/2)+'px';
    lblOld.style.left=(oldPx+phoneW/2)+'px';
    lblMgr.classList.add('vis');lblOld.classList.add('vis');
  }
  function hideLabels(){lblMgr.classList.remove('vis');lblOld.classList.remove('vis')}
  function showEnding(){endingEl.classList.add('vis')}
  function hideEnding(){endingEl.classList.remove('vis')}
  // 아이콘 위치 (폰 중앙 아래)
  function posIcon(ic,phonePx){
    var phoneH=pMgr.offsetHeight;
    ic.style.left=(phonePx+phoneW/2)+'px';
    ic.style.top=(phoneH+8)+'px';
    ic.style.transform='translateX(-50%)';
  }
  function showIcons(mgrPx,oldPx){
    posIcon(icMgr,mgrPx);icMgr.classList.add('vis','on');
    if(typeof oldPx==='number'){posIcon(icOld,oldPx);icOld.classList.add('vis','on')}
  }
  function moveIcon(ic,phonePx){ic.style.left=(phonePx+phoneW/2)+'px'}
  function hideIcons(){icMgr.classList.remove('vis','on');icOld.classList.remove('vis','on')}
  function scr(phone,name){phone.querySelectorAll('.scr').forEach(function(s){s.classList.toggle('vis',s.getAttribute('data-s')===name)})}

  function curTo(x,y){cur.classList.add('vis');cur.style.left=x+'px';cur.style.top=y+'px'}
  function curOff(){cur.classList.remove('vis')}
  function clickFx(x,y){
    cur.classList.add('click');
    rip.style.left=x+'px';rip.style.top=y+'px';
    rip.classList.remove('go');void rip.offsetWidth;rip.classList.add('go');
    w(function(){cur.classList.remove('click')},200);
  }

  function pp(phone,xp,yp){
    var r=phone.getBoundingClientRect(),s=stage.getBoundingClientRect();
    return{x:r.left-s.left+r.width*xp,y:r.top-s.top+r.height*yp};
  }

  var phoneW=pMgr.offsetWidth;
  function centerL(){return(stage.offsetWidth-phoneW)/2}
  function leftL(){return stage.offsetWidth/2-phoneW-6}
  function rightL(){return stage.offsetWidth/2+6}

  function fadeIn(phone,leftPx){phone.style.left=leftPx+'px';phone.style.opacity='1'}
  function fadeOut(phone){phone.style.opacity='0'}
  function moveTo(phone,leftPx){phone.style.left=leftPx+'px'}

  // 반짝이 glow (지속형)
  var glowInt=null;
  function startGlow(phone,interval){
    phone.classList.add('glow');
    glowInt=setInterval(function(){
      phone.classList.toggle('glow');
    },interval);
    pool.push(glowInt);
  }
  function stopGlow(phone){
    if(glowInt){clearInterval(glowInt);glowInt=null}
    phone.classList.remove('glow');
  }

  function reset(){
    [pCust,pMgr,pOld].forEach(function(p){
      p.style.transition='none';p.style.opacity='0';
    });
    pCust.style.left=leftL()+'px';
    pMgr.style.left=centerL()+'px';
    pOld.style.left=rightL()+'px';
    void pCust.offsetWidth;void pMgr.offsetWidth;void pOld.offsetWidth;
    [pCust,pMgr,pOld].forEach(function(p){p.style.transition=''});
    scr(pCust,'call');scr(pMgr,'ring');scr(pOld,'s1');
    curOff();hideIcons();hideEnding();hideLabels();
    stopGlow(pMgr);
    pMgr.classList.remove('glow');pOld.classList.remove('glow');
  }

  // ── 7클릭 시퀀스 데이터 (좌표 보정) ──
  var clickSeq=[
    {from:'s1',to:'s2',x:0.13,y:0.90},  // 전화기 아이콘
    {from:'s2',to:'s3',x:0.25,y:0.47},  // 양원규
    {from:'s3',to:'s4',x:0.78,y:0.65},  // 목록아이콘
    {from:'s4',to:'s5',x:0.30,y:0.89},  // 공유
    {from:'s5',to:'s6',x:0.30,y:0.75},  // 연락처 파일 VCF
    {from:'s6',to:'s7',x:0.70,y:0.92},  // 완료
    {from:'s7',to:null, x:0.11,y:0.70}   // 나와의 채팅
  ];

  function runClickSeq(idx,cb){
    if(!playing)return;
    if(idx>=clickSeq.length){if(cb)cb();return}

    var c=clickSeq[idx];
    var p=pp(pOld,c.x,c.y);
    curTo(p.x+15,p.y-15);
    w(function(){
      if(!playing)return;
      curTo(p.x,p.y);
      w(function(){
        if(!playing)return;
        clickFx(p.x,p.y);
        w(function(){
          if(!playing)return;
          if(c.to) scr(pOld,c.to);
          lblOld.textContent=(idx+2<=8?(idx+2)+'/8':'8/8');
          w(function(){
            if(!playing)return;
            runClickSeq(idx+1,cb);
          },125);
        },75);
      },100);
    },100);
  }

  // ── 시나리오 ──
  function go(){
    if(!playing)return;
    reset();
    bgmStart();

    // ===== SCENE 1: 고객이 전화한다 =====
    setT('고객이 전화한다');

    w(function(){
      if(!playing)return;
      fadeIn(pCust,leftL());
      fadeIn(pMgr,rightL());

      // 콜매니저 수락 클릭
      w(function(){
        if(!playing)return;
        var p=pp(pMgr,0.22,0.80);
        curTo(p.x+25,p.y-35);
        w(function(){
          if(!playing)return;
          curTo(p.x,p.y);
          w(function(){
            if(!playing)return;
            clickFx(p.x,p.y);
            w(function(){if(!playing)return; scene2()},350);
          },450);
        },500);
      },800);
    },300);
  }

  // ===== SCENE 2: 고객과 통화중 =====
  function scene2(){
    scr(pMgr,'call');
    setT('고객과 통화중');
    fadeOut(pCust);
    moveTo(pMgr,centerL());
    curOff();

    // 통화 종료 클릭
    w(function(){
      if(!playing)return;
      var e=pp(pMgr,0.50,0.84);
      curTo(e.x+20,e.y-30);
      w(function(){
        if(!playing)return;
        curTo(e.x,e.y);
        w(function(){
          if(!playing)return;
          clickFx(e.x,e.y);
          w(function(){
            if(!playing)return;
            scr(pMgr,'dispatch');
            curOff();
            scene3();
          },350);
        },450);
      },500);
    },1000);
  }

  // ===== SCENE 3: 비교 — 콜마당 vs 일반 =====
  function scene3(){
    // 좌우 라벨 표시 (폰 중앙 정렬)
    lblMgr.textContent='원클릭 배차끝';
    lblOld.textContent='1/8';
    showLabels(leftL(),rightL());

    // 콜마당 좌측 이동 + glow
    moveTo(pMgr,leftL());
    startGlow(pMgr,500);

    // 일반 폰 등장
    w(function(){
      if(!playing)return;
      scr(pOld,'s1');
      fadeIn(pOld,rightL());
      showIcons(leftL(),rightL());

      // 7클릭 시퀀스 시작
      w(function(){
        if(!playing)return;
        runClickSeq(0,function(){
          if(!playing)return;
          curOff();
          stopGlow(pMgr);
          lblOld.textContent='8번만의 배차';

          // 양쪽 타이틀 점멸
          var lblBlink=setInterval(function(){
            lblMgr.classList.toggle('vis');
            lblOld.classList.toggle('vis');
          },400);
          pool.push(lblBlink);

          w(function(){
            if(!playing)return;
            clearInterval(lblBlink);
            lblMgr.classList.add('vis');lblOld.classList.add('vis');
            fadeOut(pMgr);
            fadeOut(pOld);
            hideLabels();
            hideIcons();

            w(function(){
              if(!playing)return;
              showEnding();

              w(function(){
                if(!playing)return;
                bgmFadeOut(800,function(){
                  if(!playing)return;
                  w(function(){go()},1200);
                });
              },3000);
            },600);
          },3000);
        });
      },600);
    },350);
  }

  // 컨트롤
  function pause(){playing=false;btnPlay.innerHTML='&#9654;';bgm.pause()}
  function resume(){playing=true;btnPlay.innerHTML='&#10074;&#10074;';bgm.play().catch(function(){})}
  btnPlay.addEventListener('click',function(){if(!playing){resume()}else{pause()}});
  stage.addEventListener('click',function(){if(playing){pause()}else{resume()}});

  go();
})();
</script>
</body>
</html>
