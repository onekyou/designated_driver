<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .d2r2-text {
        font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
        font-weight: 900;
        font-size: 48px;
        fill: #FFAB00;
        letter-spacing: -2px;
      }
      .d2r2-shadow {
        font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
        font-weight: 900;
        font-size: 48px;
        fill: #FF8F00;
        letter-spacing: -2px;
      }
    </style>
  </defs>

  <!-- Shadow/Depth effect -->
  <text x="3" y="45" class="d2r2-shadow">D2R2</text>

  <!-- Main text -->
  <text x="0" y="42" class="d2r2-text">D2R2</text>

  <!-- Decorative accent -->
  <circle cx="175" cy="15" r="3" fill="#FFCF66" opacity="0.8"/>
  <circle cx="185" cy="25" r="2" fill="#FFAB00" opacity="0.6"/>
  <circle cx="190" cy="35" r="1.5" fill="#FF8F00" opacity="0.4"/>
</svg>