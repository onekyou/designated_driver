workflows:
  ios-driver-test-build:
    name: Driver iOS Test Build (Phase A - No Codesign)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: 3.41.6
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $FLUTTER_ROOT/.pub-cache
    triggering:
      events: []
    scripts:
      - name: Flutter version check
        working_directory: driver_app_flutter
        script: flutter --version
      - name: Flutter pub get
        working_directory: driver_app_flutter
        script: flutter pub get
      - name: Flutter analyze (informational)
        working_directory: driver_app_flutter
        script: flutter analyze --no-fatal-infos || true
      - name: Flutter unit test (payload helper)
        working_directory: driver_app_flutter
        script: flutter test test/fcm_token_payload_test.dart
      - name: CocoaPods install
        working_directory: driver_app_flutter/ios
        script: pod install --repo-update
      - name: Boot iOS Simulator
        script: |
          DEVICE=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE "\([A-F0-9-]{36}\)" | tr -d '()')
          echo "BOOT_ID=$DEVICE" >> $CM_ENV
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Flutter integration_test on iOS Simulator
        working_directory: driver_app_flutter
        script: |
          flutter test integration_test/platform_field_test.dart \
            -d "$BOOT_ID"
      - name: Flutter build iOS (no codesign)
        working_directory: driver_app_flutter
        script: flutter build ios --release --no-codesign
    artifacts:
      - driver_app_flutter/build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
