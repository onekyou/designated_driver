plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services' // Firebase plugin
    id 'com.google.firebase.crashlytics'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize' // Parcelize 플러그인 추가
}

android {
    namespace 'com.designated.driverapp'
    compileSdk 36
    buildToolsVersion "36.0.0"

    // 키스토어 정보 로드
    def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.designated.driverapp.app"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8' // Compatible with Kotlin 1.9.22
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    // --- Hilt 의존성 추가 ---
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    implementation libs.hilt.navigation.compose

    // --- 추가된 의존성 ---
    // Lifecycle + Compose 통합 (collectAsStateWithLifecycle 사용)
    implementation libs.lifecycle.runtime.compose
    // Firebase Task await() 사용 
    implementation libs.kotlinx.coroutines.play.services
    
    // --- Kotlin Coroutines Core/Android (StateFlow, viewModelScope 등 사용) ---
    implementation libs.kotlinx.coroutines.android
    // --- ---

    implementation libs.core.ktx
    implementation libs.lifecycle.runtime.ktx
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0' // ProcessLifecycleOwner
    implementation libs.activity.compose
    
    // Material Components for Android (for XML themes, etc.)
    implementation libs.material
    
    // Compose - 모든 Compose 라이브러리를 BOM으로 통일
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3 // Material 3
    // Compose Material Icons
    implementation libs.compose.material.icons.core
    implementation libs.compose.material.icons.extended
    
    // Navigation Compose - BOM 사용하도록 변경
    implementation libs.navigation.compose

    // ViewModel Compose
    implementation libs.lifecycle.viewmodel.compose

    // Firebase Authentication
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth.ktx
    implementation libs.firebase.firestore.ktx
    implementation libs.firebase.messaging.ktx
    implementation 'com.google.firebase:firebase-database-ktx' // Realtime Database (Presence)
    implementation 'com.google.firebase:firebase-functions-ktx' // Cloud Functions (ACK)
    implementation 'com.google.firebase:firebase-storage-ktx' // chat 이미지 업로드
    implementation libs.firebase.crashlytics.ktx // Crashlytics

    // Image (chat V1 이미지 메시지)
    implementation 'io.coil-kt:coil-compose:2.6.0' // Compose 1.6.x 호환
    implementation 'androidx.exifinterface:exifinterface:1.3.7' // EXIF orientation

    // QR Code Generation (ZXing)
    implementation 'com.google.zxing:core:3.5.2'

    // Gson (JSON 직렬화)
    implementation 'com.google.code.gson:gson:2.10.1'

    // Google Play Services Location
    implementation libs.play.services.location

    // reCAPTCHA 명시적 추가
    implementation libs.recaptcha
    implementation libs.play.services.safetynet

    // Security - Encrypted SharedPreferences (비밀번호 암호화)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Room Database
    implementation libs.room.runtime
    implementation libs.room.ktx
    kapt libs.room.compiler

    // WorkManager (오프라인 동기화)
    implementation libs.work.runtime.ktx
    implementation libs.hilt.work
    kapt libs.hilt.work.compiler

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.ui.test.junit4
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    implementation libs.accompanist.systemuicontroller
}

kapt {
    correctErrorTypes true
}