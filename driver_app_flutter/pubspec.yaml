name: driver_app_flutter
description: "대리운전 기사앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.3.3

  # State Management (Riverpod)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Value Objects
  freezed_annotation: ^2.4.4

  # Local Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Network
  connectivity_plus: ^6.0.5
  http: ^1.6.0

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # UI
  cupertino_icons: ^1.0.8

  # QR Code
  qr_flutter: ^4.1.0

  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.1

  # Firebase Realtime Database (Presence)
  firebase_database: ^11.3.3

  # Foreground Service
  flutter_foreground_task: ^8.13.4

  # Speech Recognition — Kotlin 2.1 호환 버전 필요, Phase 5에서 재추가
  # speech_to_text: ^7.3.0

  # Local Notifications (FCM용)
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
