name: driver_app_flutter
description: "대리운전 기사앱 - Clean Architecture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4

  # State Management (Riverpod)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Functional Programming
  dartz: ^0.10.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Local Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # QR Code
  qr_flutter: ^4.1.0
  # qr_code_scanner: ^1.0.1  # TODO: namespace 문제로 임시 비활성화

  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  logger: ^2.4.0

  # Speech Recognition
  speech_to_text: ^6.5.1

  # Local Notifications (FCM용)
  flutter_local_notifications: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  riverpod_generator: ^2.4.3
  injectable_generator: ^2.6.2
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Assets
  # assets:
  #   - assets/images/
  #   - assets/icons/
